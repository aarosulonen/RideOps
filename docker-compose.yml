services:
  rideops:
    build:
      context: .
      args:
        APP_UID: ${RIDEOPS_UID:-1000}
        APP_GID: ${RIDEOPS_GID:-1000}
    env_file: .env
    environment:
      RIDEOPS_DB_PATH: /app/data/rideops.db
      STRAVA_TOKEN_FILE: /app/.tokens/strava.json
    ports:
      - "8000:8000"
    volumes:
      - ./.tokens:/app/.tokens
      - rideops-data:/app/data
    restart: unless-stopped

volumes:
  rideops-data:
